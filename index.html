
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineScope | Explore filmes</title>

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>CineScope</h1>
    </header>

    <main>
        <h2>Encontre seu próximo filme</h2>

        <form id="search-form">
            <input type="search" id="search-input" placeholder="Digite o nome de um filme..." required>
            <button type="submit">Pesquisar</button>
        </form>

        <section id="movies-container">
            <p>Pesquise um filme para começar.</p>
        </section>
    </main>
</body>
</html>
